<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 | MindFlow</title>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f7fb;">
<div class="container" style="max-width: 420px; padding-top: 80px;">
    <div class="panel panel-default">
        <div class="panel-body" style="padding: 32px;">
            <h2 class="text-center">MindFlow</h2>
            <p class="text-center text-muted">登录心理情绪记录系统</p>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
            <p class="text-center" style="margin-top: 16px;">还没有账号？<a href="/register/">立即注册</a></p>
        </div>
    </div>
</div>
</body>
</html>
