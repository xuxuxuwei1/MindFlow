<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码 | MindFlow</title>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f7fb;">
<div class="container" style="max-width: 480px; padding-top: 80px;">
    <div class="panel panel-default">
        <div class="panel-body" style="padding: 32px;">
            <h2 class="text-center">修改密码</h2>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">确认新密码</label>
                    <input id="confirmNewPassword" name="confirmNewPassword" type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">提交修改</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
