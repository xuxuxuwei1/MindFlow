<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindFlow</title>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff 0%, #f8fbff 45%, #fff3ec 100%);
            color: #223;
        }
        .hero {
            max-width: 880px;
            margin: 0 auto;
            padding: 64px 24px;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(40, 72, 120, 0.12);
        }
        .badge-soft {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dff1ff;
            color: #2c5aa0;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<div class="hero">
    <div class="hero-card">
        <div class="badge-soft">心理情绪记录系统</div>
        <h1>MindFlow</h1>
        <p class="lead">情绪日志与心理趋势分析系统，帮助你记录每天的心情、识别压力来源、观察变化趋势，并给自己更温柔的提醒。</p>
        <p style="margin-top: 24px;">
            <a href="/login/" class="btn btn-primary btn-lg">登录开始记录</a>
            <a href="/about/" class="btn btn-default btn-lg">了解系统</a>
        </p>
        <hr>
        <div class="row">
            <div class="col-sm-4">
                <h4>情绪打卡</h4>
                <p>记录开心、焦虑、疲惫等状态，附带强度与事件描述。</p>
            </div>
            <div class="col-sm-4">
                <h4>趋势观察</h4>
                <p>查看近期情绪、压力、精力与睡眠的变化轨迹。</p>
            </div>
            <div class="col-sm-4">
                <h4>放松提醒</h4>
                <p>设置正念呼吸、睡前整理、社交连接等自我照顾计划。</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
